<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backoffice Login | Rui Candles</title>
    <meta name="description" content="Secure login for Rui Candles backoffice administration.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
    <div class="bg-layer">
        <div class="candle-glow glow-1"></div>
        <div class="candle-glow glow-2"></div>
        <div class="candle-glow glow-3"></div>
        <div class="grain"></div>
    </div>

    <main class="login-container">
        <div class="glass-panel">
            <div class="brand">
                <div class="logo">
                    <svg width="32" height="40" viewBox="0 0 32 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 0 C16 0 12 6 12 12 C12 15 14 17 16 17 C18 17 20 15 20 12 C20 6 16 0 16 0Z" fill="currentColor" opacity="0.9"/>
                        <rect x="14" y="16" width="4" height="22" rx="2" fill="currentColor"/>
                        <ellipse cx="16" cy="38" rx="8" ry="2" fill="currentColor" opacity="0.3"/>
                    </svg>
                </div>
                <h1>Rui Candles</h1>
                <p class="subtitle">Backoffice Administration</p>
            </div>

            <div id="auth-section">
                <div class="tab-row">
                    <button class="tab active" data-tab="signin">Sign In</button>
                    <button class="tab" data-tab="signup">Sign Up</button>
                </div>

                <form id="login-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@ruicandles.com">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrap">
                            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                            <button type="button" class="toggle-pw" tabindex="-1" aria-label="Toggle password visibility">
                                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="forgot-row">
                        <button type="button" id="forgot-btn">Forgot password?</button>
                    </div>
                    <button type="submit" class="submit-btn" id="submit-btn">
                        <span class="btn-text">Sign In</span>
                        <div class="loader"></div>
                    </button>
                </form>

                <div class="divider"><span>or</span></div>

                <button class="google-btn" id="google-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Continue with Google
                </button>
            </div>

            <div id="message-box" class="message-box"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
